<!DOCTYPE html>
<script>
    // Применяем тему ДО загрузки страницы
    (function() {
        const theme = localStorage.getItem('selectedTheme');
        if (theme === 'theme-dark') {
            document.documentElement.classList.add('theme-dark');
        }
        // Если тема не выбрана - по умолчанию светлая
    })();
</script>

<style>
    /* Скрываем всё до загрузки */
    html.loading * {
        opacity: 0 !important;
        transition: none !important;
    }
    html:not(.loading) * {
        opacity: 1 !important;
        transition: opacity 0.3s ease !important;
    }
</style>
<script>
    document.documentElement.classList.add('loading');
    window.addEventListener('load', function() {
        document.documentElement.classList.remove('loading');
    });
</script>

    <script src="script.js"></script>
    <script src="translations.js"></script>
    <script>
        // ==========================================
        // 1. БАЗА ДАННЫХ ВСЕХ КАН (из script.js)
        // ==========================================
        const allKanaMap = {
            'あ':'a','い':'i','う':'u','え':'e','お':'o',
            'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
            'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
            'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
            'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
            'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
            'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
            'や':'ya','ゆ':'yu','よ':'yo',
            'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
            'わ':'wa','を':'wo','ん':'n',
            'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
            'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
            'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
            'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
            'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
            'ア':'a','イ':'i','ウ':'u','エ':'e','オ':'o',
            'カ':'ka','キ':'ki','ク':'ku','ケ':'ke','コ':'ko',
            'サ':'sa','シ':'shi','ス':'su','セ':'se','ソ':'so',
            'タ':'ta','チ':'chi','ツ':'tsu','テ':'te','ト':'to',
            'ナ':'na','ニ':'ni','ヌ':'nu','ネ':'ne','ノ':'no',
            'ハ':'ha','ヒ':'hi','フ':'fu','ヘ':'he','ホ':'ho',
            'マ':'ma','ミ':'mi','ム':'mu','メ':'me','モ':'mo',
            'ヤ':'ya','ユ':'yu','ヨ':'yo',
            'ラ':'ra','リ':'ri','ル':'ru','レ':'re','ロ':'ro',
            'ワ':'wa','ヲ':'wo','ン':'n',
            'ガ':'ga','ギ':'gi','グ':'gu','ゲ':'ge','ゴ':'go',
            'バ':'ba','ビ':'bi','ブ':'bu','ベ':'be','ボ':'bo',
            'パ':'pa','ピ':'pi','プ':'pu','ペ':'pe','ポ':'po'
        };

        // ==========================================
        // 2. ПОЛНАЯ БАЗА СЛОВ (из script.js)
        // ==========================================
        const fullWordsData = [
            { jp: "私", reading: "watashi", ru: "Я" },
            { jp: "あなた", reading: "anata", ru: "Вы / Ты" },
            { jp: "友達", reading: "tomodachi", ru: "Друг" },
            { jp: "先生", reading: "sensei", ru: "Учитель" },
            { jp: "学生", reading: "gakusei", ru: "Студент" },
            { jp: "はい", reading: "hai", ru: "Да" },
            { jp: "いいえ", reading: "iie", ru: "Нет" },
            { jp: "ありがとう", reading: "arigatou", ru: "Спасибо" },
            { jp: "さようなら", reading: "sayounara", ru: "До свидания" },
            { jp: "猫", reading: "neko", ru: "Кошка" },
            { jp: "犬", reading: "inu", ru: "Собака" },
            { jp: "鳥", reading: "tori", ru: "Птица" },
            { jp: "魚", reading: "sakana", ru: "Рыба" },
            { jp: "水", reading: "mizu", ru: "Вода" },
            { jp: "お茶", reading: "ocha", ru: "Чай" },
            { jp: "ご飯", reading: "gohan", ru: "Рис / Еда" },
            { jp: "ラーメン", reading: "raamen", ru: "Рамен" },
            { jp: "パン", reading: "pan", ru: "Хлеб" },
            { jp: "肉", reading: "niku", ru: "Мясо" },
            { jp: "家", reading: "ie", ru: "Дом" },
            { jp: "学校", reading: "gakkou", ru: "Школа" },
            { jp: "本", reading: "hon", ru: "Книга" },
            { jp: "車", reading: "kuruma", ru: "Машина" },
            { jp: "山", reading: "yama", ru: "Гора" },
            { jp: "川", reading: "kawa", ru: "Река" },
            { jp: "赤", reading: "aka", ru: "Красный" },
            { jp: "青", reading: "ao", ru: "Синий" },
            { jp: "白", reading: "shiro", ru: "Белый" },
            { jp: "黒", reading: "kuro", ru: "Черный" },
            { jp: "黄色", reading: "kiiro", ru: "Желтый" },
            { jp: "緑", reading: "midori", ru: "Зеленый" },
            { jp: "食べる", reading: "taberu", ru: "Есть / Кушать" },
            { jp: "飲む", reading: "nomu", ru: "Пить" },
            { jp: "行く", reading: "iku", ru: "Идти / Ехать" },
            { jp: "来る", reading: "kuru", ru: "Приходить" },
            { jp: "見る", reading: "miru", ru: "Смотреть" },
            { jp: "聞く", reading: "kiku", ru: "Слушать / Спрашивать" },
            { jp: "する", reading: "suru", ru: "Делать" }
        ];

        // ==========================================
        // 3. ПЕРЕМЕННЫЕ
        // ==========================================
        let activePool = [];
        let currentQuestion = 0;
        let questionsAnswered = 0;
        let totalQuestionsLimit = Infinity;
        let currentMode = 'write';
        let correctCounter = 0;
        let wrongCounter = 0;

        // ==========================================
        // 4. ФУНКЦИИ УПРАВЛЕНИЯ ТЕСТОМ
        // ==========================================

        function toggleRows(type) {
            const rows = document.getElementById(`${type}-rows`);
            rows.classList.toggle('hidden');
        }

        function selectAll(type, check) {
            const checkboxes = document.querySelectorAll(`#${type}-rows .kana-checkbox`);
            checkboxes.forEach(cb => cb.checked = check);
            applySelectedRows();
        }

        function toggleRowGroup(masterCb, groupClass) {
            const checkboxes = document.querySelectorAll(`.${groupClass}`);
            checkboxes.forEach(cb => cb.checked = masterCb.checked);
            applySelectedRows();
        }

        function switchTestType() {
            const type = document.getElementById('test-type').value;
            const settings = document.getElementById('script-settings');
            const warning = document.getElementById('select-warning');

            if (type === 'words') {
                settings.classList.add('hidden');
                warning.classList.add('hidden');
                document.getElementById('test-mode').value = 'choice';
            } else {
                settings.classList.remove('hidden');
                warning.classList.remove('hidden');
            }
            applySelectedRows();
        }

        function applySelectedRows() {
            const type = document.getElementById('test-type').value;

            if (type === 'words') {
                // Используем полную базу слов
                activePool = fullWordsData.map(w => ({
                    question: w.ru,
                    answer: w.jp,
                    reading: w.reading,
                    speech: w.reading,
                    isWord: true,
                    // Генерируем варианты ответов
                    options: generateWordOptions(w.jp)
                }));
                document.getElementById('select-warning').classList.add('hidden');
            } else {
                const checked = document.querySelectorAll('.kana-checkbox:checked');
                activePool = [];
                checked.forEach(cb => {
                    const char = cb.getAttribute('data-kana');
                    if (char && allKanaMap[char]) {
                        activePool.push({
                            char: char,
                            romaji: allKanaMap[char],
                            isWord: false
                        });
                    }
                });

                const warning = document.getElementById('select-warning');
                if (activePool.length === 0) {
                    warning.classList.remove('hidden');
                    document.getElementById('test-kana').innerText = '-';
                    return;
                } else {
                    warning.classList.add('hidden');
                }
            }

            // Перемешиваем и начинаем тест
            shuffleArray(activePool);
            questionsAnswered = 0;
            currentQuestion = 0;
            showQuestion();
        }

        function generateWordOptions(correctAnswer) {
            const options = [correctAnswer];
            const allWords = fullWordsData.map(w => w.jp);
            const shuffled = shuffleArray(allWords);
            
            for (let word of shuffled) {
                if (!options.includes(word) && options.length < 4) {
                    options.push(word);
                }
            }
            return shuffleArray(options);
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showQuestion() {
            if (!activePool || activePool.length === 0) {
                document.getElementById('test-kana').innerText = '-';
                return;
            }

            const mode = document.getElementById('test-mode').value;
            const type = document.getElementById('test-type').value;
            const limitSelect = document.getElementById('test-limit');
            totalQuestionsLimit = (limitSelect && limitSelect.value !== 'inf') ? parseInt(limitSelect.value) : Infinity;

            if (questionsAnswered >= totalQuestionsLimit) {
                document.getElementById('test-kana').innerText = '🎉';
                document.getElementById('test-result').textContent = 
                    `Сессия окончена! Пройдено вопросов: ${questionsAnswered}`;
                document.getElementById('input-container').classList.add('hidden');
                document.getElementById('choice-container').classList.add('hidden');
                return;
            }

            // Если дошли до конца массива - перемешиваем заново
            if (currentQuestion >= activePool.length) {
                shuffleArray(activePool);
                currentQuestion = 0;
            }

            const currentItem = activePool[currentQuestion];
            const inputContainer = document.getElementById('input-container');
            const choiceContainer = document.getElementById('choice-container');

            document.getElementById('test-hint').innerHTML = '';
            document.getElementById('test-result').innerHTML = '';

            if (currentItem.isWord || mode === 'choice') {
                inputContainer.classList.add('hidden');
                choiceContainer.classList.remove('hidden');

                if (currentItem.isWord) {
                    // Режим "Слова": показываем перевод, выбираем японское слово
                    document.getElementById('test-kana').innerText = currentItem.question;
                    renderChoiceButtons(currentItem.options, currentItem.answer, true);
                } else {
                    // Режим "Кана": показываем чтение, выбираем кану
                    document.getElementById('test-kana').innerText = currentItem.romaji;
                    let options = [currentItem.char];
                    const allChars = Object.keys(allKanaMap);
                    while (options.length < 4) {
                        const randomChar = allChars[Math.floor(Math.random() * allChars.length)];
                        if (!options.includes(randomChar)) options.push(randomChar);
                    }
                    renderChoiceButtons(shuffleArray(options), currentItem.char, false);
                }
            } else {
                inputContainer.classList.remove('hidden');
                choiceContainer.classList.add('hidden');
                document.getElementById('test-kana').innerText = currentItem.char;
                document.getElementById('test-answer').value = '';
                document.getElementById('test-answer').focus();
            }
        }

        function renderChoiceButtons(options, correctAnswer, isWordMode) {
            const container = document.getElementById('choice-container');
            container.innerHTML = '';
            container.classList.remove('hidden');
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    const isCorrect = (opt === correctAnswer);
                    handleAnswer(isCorrect, correctAnswer, isWordMode);
                };
                container.appendChild(btn);
            });
        }

        function checkAnswer() {
            const inputField = document.getElementById('test-answer');
            const userAnswer = inputField.value.trim().toLowerCase();
            if (!userAnswer || !activePool || activePool.length === 0) return;

            const currentItem = activePool[currentQuestion];
            const isCorrect = (userAnswer === currentItem.romaji);
            handleAnswer(isCorrect, currentItem.romaji, false);
        }

        function handleAnswer(isCorrect, expected, isWordMode) {
            const resultDisplay = document.getElementById('test-result');

            if (isCorrect) {
                correctCounter++;
                document.getElementById('correct-count').innerText = correctCounter;
                resultDisplay.style.color = 'green';
                resultDisplay.innerText = 'Правильно! 🎉';

                if (typeof recordAnswer === 'function') {
                    recordAnswer(true);
                }

                // Переходим к следующему вопросу (случайному)
                setTimeout(() => {
                    questionsAnswered++;
                    // Выбираем случайный вопрос
                    if (activePool.length > 0) {
                        currentQuestion = Math.floor(Math.random() * activePool.length);
                        showQuestion();
                    }
                }, 800);
            } else {
                wrongCounter++;
                document.getElementById('wrong-count').innerText = wrongCounter;
                resultDisplay.style.color = 'red';
                resultDisplay.innerText = `❌ Ошибка! Правильно: "${expected}"`;

                if (typeof recordAnswer === 'function') {
                    recordAnswer(false);
                }

                // Показываем новый вопрос через секунду
                setTimeout(() => {
                    if (activePool.length > 0) {
                        currentQuestion = Math.floor(Math.random() * activePool.length);
                        showQuestion();
                    }
                }, 1200);
            }
        }

        function showHint() {
            if (!activePool || activePool.length === 0 || !activePool[currentQuestion]) return;

            const currentItem = activePool[currentQuestion];
            const typeSelect = document.getElementById('test-type');
            const isWordsMode = typeSelect && typeSelect.value === 'words';
            const hintElem = document.getElementById('test-hint');

            // Озвучиваем
            const textToSpeak = currentItem.speech || currentItem.reading || currentItem.answer || currentItem.char;
            if (textToSpeak && typeof speakKana === 'function') {
                speakKana(textToSpeak);
            }

            if (hintElem) {
                if (isWordsMode || currentItem.isWord) {
                    // Для слов показываем полную информацию
                    const wordData = fullWordsData.find(w => 
                        w.jp === currentItem.answer || 
                        w.ru === currentItem.question
                    );
                    
                    if (wordData) {
                        hintElem.innerHTML = `
                            <br><strong>${wordData.jp}</strong><br>
                            Чтение: ${wordData.reading}<br>
                            Перевод: ${wordData.ru}
                        `;
                    } else if (currentItem.answer) {
                        hintElem.innerHTML = `
                            <br><strong>${currentItem.answer}</strong><br>
                            Чтение: ${currentItem.reading || '?'}
                        `;
                    }
                } else {
                    // Для каны
                    const char = currentItem.char;
                    const data = window.kanaData ? window.kanaData[char] : null;
                    if (data) {
                        hintElem.innerHTML = `
                            <br><strong>${char}</strong><br>
                            Читается: ${data.reading}<br>
                            Пример: ${data.example} (${data.exampleReading}) — ${data.meaning}
                        `;
                    } else {
                        hintElem.innerHTML = `
                            <br><strong>${char}</strong><br>
                            Чтение: ${currentItem.romaji}
                        `;
                    }
                }
            }
        }

        function resetStats() {
            if (confirm('Сбросить статистику?')) {
                correctCounter = 0;
                wrongCounter = 0;
                document.getElementById('correct-count').innerText = 0;
                document.getElementById('wrong-count').innerText = 0;
                document.getElementById('test-result').innerText = 'Статистика сброшена';
                
                if (typeof localStorage !== 'undefined') {
                    localStorage.removeItem('correctCount');
                    localStorage.removeItem('wrongCount');
                }
            }
        }

        // ==========================================
        // 5. ВИДЖЕТ ПОЛЬЗОВАТЕЛЯ
        // ==========================================

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => {
                    localStorage.removeItem('user');
                    location.reload();
                })
                .catch(() => {
                    localStorage.removeItem('user');
                    location.reload();
                });
        }

        // ==========================================
        // 6. ИНИЦИАЛИЗАЦИЯ
        // ==========================================

        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем авторизацию
            fetch('/api/me')
                .then(res => res.json())
                .then(data => {
                    if (data && data.logged_in) {
                        const user = data.user;
                        document.getElementById('userName').innerText = user.username;
                        document.getElementById('userAvatar').innerText = user.username[0].toUpperCase();
                        document.getElementById('logoutBtn').style.display = 'block';
                        // Загружаем статистику с сервера
                        if (user.correctCount !== undefined) {
                            correctCounter = user.correctCount;
                            document.getElementById('correct-count').innerText = correctCounter;
                        }
                        if (user.wrongCount !== undefined) {
                            wrongCounter = user.wrongCount;
                            document.getElementById('wrong-count').innerText = wrongCounter;
                        }
                    } else {
                        document.getElementById('userName').innerText = 'Гость';
                        document.getElementById('logoutBtn').style.display = 'none';
                        // Загружаем статистику из localStorage
                        const savedCorrect = parseInt(localStorage.getItem('correctCount')) || 0;
                        const savedWrong = parseInt(localStorage.getItem('wrongCount')) || 0;
                        correctCounter = savedCorrect;
                        wrongCounter = savedWrong;
                        document.getElementById('correct-count').innerText = correctCounter;
                        document.getElementById('wrong-count').innerText = wrongCounter;
                    }
                })
                .catch(() => {
                    // Офлайн режим
                    document.getElementById('userName').innerText = 'Гость';
                    document.getElementById('logoutBtn').style.display = 'none';
                    const savedCorrect = parseInt(localStorage.getItem('correctCount')) || 0;
                    const savedWrong = parseInt(localStorage.getItem('wrongCount')) || 0;
                    correctCounter = savedCorrect;
                    wrongCounter = savedWrong;
                    document.getElementById('correct-count').innerText = correctCounter;
                    document.getElementById('wrong-count').innerText = wrongCounter;
                });

            // Выбираем первые 5 хирагана по умолчанию
            const defaultCbs = document.querySelectorAll('.h-a');
            defaultCbs.forEach(cb => cb.checked = true);
            
            // Применяем переводы
            if (typeof applyTranslations === 'function') {
                applyTranslations();
            }

            // Запускаем тест
            setTimeout(() => {
                applySelectedRows();
            }, 100);
        });

        // Поддержка Enter в поле ввода
        document.addEventListener('keypress', function(e) {
            if (e.target.id === 'test-answer' && e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Функция speakKana (если не определена в script.js)
        if (typeof speakKana === 'undefined') {
            window.speakKana = function(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ja-JP';
                    utterance.rate = 0.8;
                    window.speechSynthesis.speak(utterance);
                }
            };
        }
    </script>
</body>

</html>
