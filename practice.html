<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упражнения — Японский язык</title>
    <style>
        :root {
            --primary-color: #e63946;
            --bg-color: #f8f9fa;
            --text-color: #1d3557;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .user-header-widget {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 0.95rem;
        }

        .user-avatar {
            background: #e63946;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .logout-btn {
            background: #f8f9fa;
            border: 1px solid #ccc;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #ffebeb;
            color: #e63946;
            border-color: #e63946;
        }

        .back-button {
            align-self: flex-start;
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .lang-btn {
            /* Раньше здесь было position: fixed; left: 170px —
               на узких экранах (~375px) это растягивало кнопку
               почти на всю правую половину страницы, поверх
               остального контента. Теперь кнопка — обычный элемент
               в потоке документа, в одном ряду с кнопкой "Назад",
               и никуда не наезжает. */
            background: #1d3557;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background: #457b9d;
            transform: scale(1.05);
        }

        h1 { margin-bottom: 5px; color: var(--primary-color); }

        .script-settings {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .script-option {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 320px;
        }

        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .row-selection { margin-top: 10px; }
        .hidden { display: none !important; }

        .select-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .select-buttons button {
            flex: 1;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .individual-kana-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .kana-row-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #eee;
            padding: 4px 0;
        }

        .kana-row-group label {
            cursor: pointer;
            font-size: 1.1rem;
        }

        .row-title {
            color: var(--primary-color);
            min-width: 75px;
            font-size: 0.9rem !important;
        }

        #kana-test {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        #test-answer {
            padding: 10px;
            font-size: 1.2rem;
            width: 60%;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .hint-btn {
            background-color: #e9c46a;
            color: #1d3557;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        #test-result {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            min-height: 25px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .choice-btn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .choice-btn:hover {
            transform: scale(1.03);
        }
    </style>
</head>

    <p id="select-warning" style="text-align: center; font-weight: bold; margin-bottom: 15px;" data-i18n="select_symbol_warning">
        Выберите хотя бы один символ выше ⬆️
    </p>

    <!-- Выбор режима и количества вопросов -->
    <div class="test-config" style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; max-width: 500px; width: 100%;">
        <label style="margin-right: 15px;">
            <b data-i18n="test_type">Тип теста:</b>
            <select id="test-type" onchange="switchTestType()" style="padding: 5px; border-radius: 6px;">
                <option value="kana" data-i18n="opt_type_kana">Азбука (Кана)</option>
                <option value="words" data-i18n="opt_type_words">Слова (単語)</option>
            </select>
        </label>

        <label style="margin-right: 15px;">
            <b data-i18n="test_mode">Режим:</b>
            <select id="test-mode" onchange="applySelectedRows()" style="padding: 5px; border-radius: 6px;">
                <option value="write" data-i18n="opt_mode_write">Кана → Ввод чтения</option>
                <option value="choice" data-i18n="opt_mode_choice">Чтение → Выбор каны</option>
            </select>
        </label>

        <label>
            <b data-i18n="questions_limit">Вопросов:</b>
            <select id="test-limit" onchange="applySelectedRows()" style="padding: 5px; border-radius: 6px;">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="inf" selected data-i18n="opt_limit_inf">∞ Бесконечно</option>
            </select>
        </label>
    </div>

    <div id="kana-test">
        <h2 data-i18n="testing_header">Тестирование</h2>
        <p id="test-kana" style="font-size: 70px; margin: 10px 0; color: #e63946;">-</p>
        
        <div id="input-container">
            <input type="text" id="test-answer" placeholder="чтение (a, ka, i...)">
            <br>
            <button class="action-btn" onclick="checkAnswer()" data-i18n="btn_check">Проверить</button>
            <button class="hint-btn" onclick="showHint()" data-i18n="btn_hint">💡 Подсказка</button>
        </div>

        <div id="choice-container" class="choice-grid hidden">
            <!-- Кнопки выбора ответов -->
        </div>

        <p id="test-result"></p>
        <div id="test-hint"></div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
        <p><span data-i18n="stat_correct">Правильно:</span> <span id="correct-count" style="color: green; font-weight: bold;">0</span> | <span data-i18n="stat_wrong">Неправильно:</span> <span id="wrong-count" style="color: red; font-weight: bold;">0</span></p>

        <button onclick="resetStats()" style="margin-top: 10px; background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;" data-i18n="btn_reset_stats">
            🔄 Сбросить статистику
        </button>
    </div>

    <script src="script.js"></script>
    <script src="translations.js"></script>
    <script>
        // Общая база данных каны
        const allKanaMap = {
            'あ':'a','い':'i','う':'u','え':'e','お':'o',
            'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
            'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
            'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
            'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
            'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
            'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
            'や':'ya','ゆ':'yu','よ':'yo',
            'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
            'わ':'wa','を':'wo','ん':'n',
            'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
            'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
            'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
            'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
            'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
            'ア':'a','イ':'i','ウ':'u','エ':'e','オ':'o',
            'カ':'ka','キ':'ki','ク':'ku','ケ':'ke','コ':'ko',
            'サ':'sa','シ':'shi','ス':'su','セ':'se','ソ':'so',
            'タ':'ta','チ':'chi','ツ':'tsu','テ':'te','ト':'to',
            'ナ':'na','ニ':'ni','ヌ':'nu','ネ':'ne','ノ':'no',
            'ハ':'ha','ヒ':'hi','フ':'fu','ヘ':'he','ホ':'ho',
            'マ':'ma','ミ':'mi','ム':'mu','メ':'me','モ':'mo',
            'ヤ':'ya','ユ':'yu','ヨ':'yo',
            'ラ':'ra','リ':'ri','ル':'ru','レ':'re','ロ':'ro',
            'ワ':'wa','ヲ':'wo','ン':'n',
            'ガ':'ga','ギ':'gi','グ':'gu','ゲ':'ge','ゴ':'go',
            'バ':'ba','ビ':'bi','ブ':'bu','ベ':'be','ボ':'bo',
            'パ':'pa','ピ':'pi','プ':'pu','ペ':'pe','ポ':'po'
        };

        // Локальное имя (practiceWordsData), а не wordsData —
        // script.js тоже объявляет const wordsData на верхнем уровне,
        // и при одинаковом имени браузер выбрасывал SyntaxError
        // "Identifier 'wordsData' has already been declared",
        // из-за чего вообще весь тренажёр переставал работать.
        const practiceWordsData = [
            { question: 'кошка', answer: 'ねこ', options: ['ねこ', 'いぬ', 'さかな', 'とり'] },
            { question: 'собака', answer: 'いぬ', options: ['いぬ', 'ねこ', 'うま', 'さる'] },
            { question: 'рыба', answer: 'さかな', options: ['さかな', 'ふね', 'みず', 'ほし'] },
            { question: 'книга', answer: 'ほん', options: ['ほん', 'ペン', 'つくえ', 'やま'] },
            { question: 'вода', answer: 'みず', options: ['みず', 'おちゃ', 'さけ', '川'] },
            { question: 'дом', answer: 'いえ', options: ['いえ', 'みせ', 'えき', 'こうえん'] },
            { question: 'друг', answer: 'ともだち', options: ['ともだち', 'かぞく', 'せんせい', 'がくせい'] },
            { question: 'утро', answer: 'あさ', options: ['あさ', 'ひる', 'よる', 'いま'] },
            { question: 'красный', answer: 'あか', options: ['あか', 'あお', 'しろ', 'くろ'] },
            { question: 'пить', answer: 'のむ', options: ['のむ', 'たべる', 'いく', 'みる'] }
        ];

        let activePool = [];
        let currentItem = null;
        let correctCounter = 0;
        let wrongCounter = 0;

        function toggleRows(type) {
            const rows = document.getElementById(`${type}-rows`);
            rows.classList.toggle('hidden');
        }

        function selectAll(type, check) {
            const checkboxes = document.querySelectorAll(`#${type}-rows .kana-checkbox`);
            checkboxes.forEach(cb => cb.checked = check);
            applySelectedRows();
        }

        function toggleRowGroup(masterCb, groupClass) {
            const checkboxes = document.querySelectorAll(`.${groupClass}`);
            checkboxes.forEach(cb => cb.checked = masterCb.checked);
            applySelectedRows();
        }

        function switchTestType() {
            const type = document.getElementById('test-type').value;
            const settings = document.getElementById('script-settings');
            const warning = document.getElementById('select-warning');

            if (type === 'words') {
                settings.classList.add('hidden');
                warning.classList.add('hidden');
                document.getElementById('test-mode').value = 'choice';
            } else {
                settings.classList.remove('hidden');
                warning.classList.remove('hidden');
            }
            applySelectedRows();
        }

        function applySelectedRows() {
            const type = document.getElementById('test-type').value;

            if (type === 'words') {
                activePool = practiceWordsData;
                document.getElementById('select-warning').classList.add('hidden');
            } else {
                const checked = document.querySelectorAll('.kana-checkbox:checked');
                activePool = [];
                checked.forEach(cb => {
                    const char = cb.getAttribute('data-kana');
                    if (char && allKanaMap[char]) {
                        activePool.push({ char: char, romaji: allKanaMap[char] });
                    }
                });

                const warning = document.getElementById('select-warning');
                if (activePool.length === 0) {
                    warning.classList.remove('hidden');
                    document.getElementById('test-kana').innerText = '-';
                    return;
                } else {
                    warning.classList.add('hidden');
                }
            }

            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (activePool.length === 0) return;

            const mode = document.getElementById('test-mode').value;
            const type = document.getElementById('test-type').value;
            const inputContainer = document.getElementById('input-container');
            const choiceContainer = document.getElementById('choice-container');

            const randomIndex = Math.floor(Math.random() * activePool.length);
            currentItem = activePool[randomIndex];

            document.getElementById('test-hint').innerText = '';
            document.getElementById('test-result').innerText = '';

            if (type === 'words' || mode === 'choice') {
                inputContainer.classList.add('hidden');
                choiceContainer.classList.remove('hidden');

                if (type === 'words') {
                    document.getElementById('test-kana').innerText = currentItem.question;
                    renderChoiceButtons(currentItem.options, currentItem.answer);
                } else {
                    document.getElementById('test-kana').innerText = currentItem.romaji;
                    
                    let options = [currentItem.char];
                    while (options.length < 4) {
                        const randomChar = Object.keys(allKanaMap)[Math.floor(Math.random() * Object.keys(allKanaMap).length)];
                        if (!options.includes(randomChar)) options.push(randomChar);
                    }
                    options.sort(() => Math.random() - 0.5);
                    renderChoiceButtons(options, currentItem.char);
                }
            } else {
                inputContainer.classList.remove('hidden');
                choiceContainer.classList.add('hidden');
                document.getElementById('test-kana').innerText = currentItem.char;
                document.getElementById('test-answer').value = '';
                document.getElementById('test-answer').focus();
            }
        }

        function renderChoiceButtons(options, correctAnswer) {
            const container = document.getElementById('choice-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt === correctAnswer, correctAnswer);
                container.appendChild(btn);
            });
        }

        function checkAnswer() {
            const inputField = document.getElementById('test-answer');
            const userAnswer = inputField.value.trim().toLowerCase();
            if (!userAnswer || !currentItem) return;

            const isCorrect = (userAnswer === currentItem.romaji);
            handleAnswer(isCorrect, currentItem.romaji);
        }

        function handleAnswer(isCorrect, expected) {
            const resultDisplay = document.getElementById('test-result');

            if (isCorrect) {
                correctCounter++;
                document.getElementById('correct-count').innerText = correctCounter;
                resultDisplay.style.color = 'green';
                resultDisplay.innerText = 'Правильно! 🎉';

                if (typeof recordAnswer === 'function') {
                    recordAnswer(true);
                }

                setTimeout(loadNextQuestion, 800);
            } else {
                wrongCounter++;
                document.getElementById('wrong-count').innerText = wrongCounter;
                resultDisplay.style.color = 'red';
                resultDisplay.innerText = `❌ Ошибка! Правильно: "${expected}"`;

                if (typeof recordAnswer === 'function') {
                    recordAnswer(false);
                }

                setTimeout(loadNextQuestion, 1500);
            }
        }

        function showHint() {
            if (currentItem && currentItem.romaji) {
                document.getElementById('test-hint').innerText = `💡 Чтение начинается на: "${currentItem.romaji[0]}"`;
            }
        }

        function resetStats() {
            correctCounter = 0;
            wrongCounter = 0;
            document.getElementById('correct-count').innerText = 0;
            document.getElementById('wrong-count').innerText = 0;
            document.getElementById('test-result').innerText = 'Статистика сброшена';
        }

        function logout() {
            localStorage.removeItem('user');
            location.href = 'index.html';
        }

        document.getElementById('test-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });

        window.onload = function() {
            const defaultCbs = document.querySelectorAll('.h-a');
            defaultCbs.forEach(cb => cb.checked = true);
            applySelectedRows();

            const savedUser = JSON.parse(localStorage.getItem('user') || 'null');
            if (savedUser && savedUser.username) {
                document.getElementById('userName').innerText = savedUser.username;
                document.getElementById('userAvatar').innerText = savedUser.username[0].toUpperCase();
            } else {
                document.getElementById('userName').innerText = 'Гость';
                document.getElementById('logoutBtn').style.display = 'none';
            }

            if (typeof applyTranslations === 'function') {
                applyTranslations();
            }
        };
    </script>
</body>
