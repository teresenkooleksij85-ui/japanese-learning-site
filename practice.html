<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">

    <title>Упражнения — Японский язык</title>
    <style>
        :root {
            --primary-color: #e63946;
            --bg-color: #f8f9fa;
            --text-color: #1d3557;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-button {
            align-self: flex-start;
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        h1 { margin-bottom: 5px; color: var(--primary-color); }

        .script-settings {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .script-option {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 320px;
        }

        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .row-selection { margin-top: 10px; }
        .hidden { display: none; }

        .select-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .select-buttons button {
            flex: 1;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .individual-kana-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .kana-row-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #eee;
            padding: 4px 0;
        }

        .kana-row-group label {
            cursor: pointer;
            font-size: 1.1rem;
        }

        .row-title {
            color: var(--primary-color);
            min-width: 75px;
            font-size: 0.9rem !important;
        }

        #kana-test {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        #test-answer {
            padding: 10px;
            font-size: 1.2rem;
            width: 60%;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .hint-btn {
            background-color: #e9c46a;
            color: #1d3557;
            border: none;
            padding: 10px 18px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        #test-result {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            min-height: 25px;
        }
    </style>
</head>

    <div id="kana-test">
        <h2>Тестирование</h2>
        <p id="test-kana" style="font-size: 70px; margin: 10px 0; color: #e63946;">-</p>
        <input type="text" id="test-answer" placeholder="чтение (a, ka, i...)">
        <br>
        <button class="action-btn" onclick="checkAnswer()">Проверить</button>
        <button class="hint-btn" onclick="showHint()">💡 Подсказка</button>

        <p id="test-result"></p>
        <div id="test-hint"></div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
        <p>Правильно: <span id="correct-count" style="color: green; font-weight: bold;">0</span> | Неправильно: <span id="wrong-count" style="color: red; font-weight: bold;">0</span></p>

        <button onclick="resetStats()" style="margin-top: 10px; background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">
            🔄 Сбросить статистику
        </button>
    </div>

<script src="script.js"></script>
    <script>
        // База каны для теста
        const kanaQuizData = [
            { char: 'あ', romaji: 'a' },  { char: 'い', romaji: 'i' },  { char: 'う', romaji: 'u' },  { char: 'え', romaji: 'e' },  { char: 'お', romaji: 'o' },
            { char: 'か', romaji: 'ka' }, { char: 'き', romaji: 'ki' }, { char: 'く', romaji: 'ku' }, { char: 'け', romaji: 'ke' }, { char: 'こ', romaji: 'ko' },
            { char: 'さ', romaji: 'sa' }, { char: 'し', romaji: 'shi' },{ char: 'す', romaji: 'su' }, { char: 'せ', romaji: 'se' }, { char: 'そ', romaji: 'so' },
            { char: 'た', romaji: 'ta' }, { char: 'ち', romaji: 'chi' },{ char: 'つ', romaji: 'tsu' }, { char: 'て', romaji: 'te' }, { char: 'と', romaji: 'to' },
            { char: 'な', romaji: 'na' }, { char: 'に', romaji: 'ni' }, { char: 'ぬ', romaji: 'nu' }, { char: 'ね', romaji: 'ne' }, { char: 'の', romaji: 'no' }
        ];

        let currentQuizKana = null;
        let correctCounter = 0;
        let wrongCounter = 0;

        function loadNextKana() {
            const randomIndex = Math.floor(Math.random() * kanaQuizData.length);
            currentQuizKana = kanaQuizData[randomIndex];
            
            document.getElementById('test-kana').innerText = currentQuizKana.char;
            document.getElementById('test-answer').value = '';
            document.getElementById('test-hint').innerText = '';
            document.getElementById('test-result').innerText = '';
            document.getElementById('test-answer').focus();
        }

        function checkAnswer() {
            const inputField = document.getElementById('test-answer');
            const userAnswer = inputField.value.trim().toLowerCase();
            const resultDisplay = document.getElementById('test-result');

            if (!userAnswer) return;

            if (userAnswer === currentQuizKana.romaji) {
                correctCounter++;
                document.getElementById('correct-count').innerText = correctCounter;
                resultDisplay.style.color = 'green';
                resultDisplay.innerText = '✅ Правильно!';
                
                // 🚀 Отправляем правильный ответ на сервер для зачета ачивки
                if (typeof recordAnswer === 'function') {
                    recordAnswer(true);
                }

                setTimeout(loadNextKana, 800);
            } else {
                wrongCounter++;
                document.getElementById('wrong-count').innerText = wrongCounter;
                resultDisplay.style.color = 'red';
                resultDisplay.innerText = `❌ Ошибка! Правильно: "${currentQuizKana.romaji}"`;

                // ❌ Отправляем ошибку на сервер
                if (typeof recordAnswer === 'function') {
                    recordAnswer(false);
                }

                setTimeout(loadNextKana, 1500);
            }
        }

        function showHint() {
            if (currentQuizKana) {
                document.getElementById('test-hint').innerText = `💡 Чтение начинается на: "${currentQuizKana.romaji[0]}"`;
            }
        }

        function resetStats() {
            correctCounter = 0;
            wrongCounter = 0;
            document.getElementById('correct-count').innerText = 0;
            document.getElementById('wrong-count').innerText = 0;
            document.getElementById('test-result').innerText = 'Статистика сброшена';
        }

        // Обработка нажатия Enter в поле ввода
        document.getElementById('test-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Запуск первого вопроса при открытии страницы
        window.onload = loadNextKana;
    </script>
</body>
