<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения — 実績</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .back-button {
            background: #1d3557;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            background: #457b9d;
        }

        .achievements-container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1d3557;
            margin-top: 0;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .ach-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8f9fa;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .ach-card.unlocked {
            border-color: #2ed573;
            background: #f0fff4;
        }

        .ach-card.locked {
            opacity: 0.6;
            filter: grayscale(80%);
        }

        .ach-icon {
            font-size: 2.5rem;
            min-width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .ach-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #1d3557;
        }

        .ach-info p {
            margin: 0;
            font-size: 0.88rem;
            color: #666;
        }

        .ach-status {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .unlocked .ach-status {
            background: #2ed573;
            color: white;
        }

        .locked .ach-status {
            background: #a4b0be;
            color: white;
        }

        .auth-notice {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid #ffeeba;
        }

        body.theme-dark .achievements-container {
            background-color: #1e1e2d !important;
            color: #fff !important;
        }

        body.theme-dark .ach-card {
            background: #2a2a3d;
            border-color: #3a3a52;
        }

        body.theme-dark .ach-card.unlocked {
            background: #1c3326;
            border-color: #2ed573;
        }

        body.theme-dark .ach-icon {
            background: #1e1e2d;
        }

        body.theme-dark .ach-info h3 {
            color: #fff;
        }

        body.theme-dark .ach-info p {
            color: #aaa;
        }
    </style>
</head>

<body>

    <button class="back-button" onclick="location.href='index.html'" data-i18n="back_menu">← Главное меню</button>
    <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">🌐 RU</button>

    <div class="achievements-container">
        <h1 data-i18n="achievements_title">実績 (Достижения)</h1>
        <p class="subtitle" data-i18n="achievements_subtitle">Твой личный прогресс и награды 🏆</p>

        <div id="authNotice" class="auth-notice hidden">
            <span data-i18n="not_logged_notice">Вы не вошли в аккаунт.</span> 
            <a href="index.html" style="color: #856404; font-weight: bold;" data-i18n="login_link">Войдите на главной странице</a>, 
            <span data-i18n="not_logged_suffix">чтобы сохранять свой прогресс и получать достижения!</span>
        </div>

        <div class="achievements-grid" id="achievementsList">
            <!-- Список достижений генерируется JS -->
            <p style="text-align: center; grid-column: 1/-1;" data-i18n="loading_achievements">Загрузка достижений...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="translations.js"></script>
    <script>
        const achievementsData = [
            { id: 'first_step', icon: '🐣', titleKey: 'ach_first_step_title', descKey: 'ach_first_step_desc' },
            { id: 'hundred_correct', icon: '🎯', titleKey: 'ach_hundred_correct_title', descKey: 'ach_hundred_correct_desc' },
            { id: 'week_marathon', icon: '🔥', titleKey: 'ach_week_marathon_title', descKey: 'ach_week_marathon_desc' },
            { id: 'shogun', icon: '🏯', titleKey: 'ach_shogun_title', descKey: 'ach_shogun_desc' }
        ];

        function getTranslation(key, fallback) {
            const currentLang = localStorage.getItem('app_lang') || 'ru';
            if (window.translations && window.translations[currentLang] && window.translations[currentLang][key]) {
                return window.translations[currentLang][key];
            }
            return fallback;
        }

        // Те же условия, что и check_and_unlock_achievements() в app.py —
        // нужны, чтобы у гостя (без аккаунта) достижения тоже честно считались.
        function computeLocalUnlocked() {
            const correct = parseInt(localStorage.getItem('correctCount')) || 0;
            const streak = parseInt(localStorage.getItem('streakDays')) || 0;
            const level = Math.floor(correct / 10) + 1;

            const unlocked = [];
            if (correct >= 1) unlocked.push('first_step');
            if (correct >= 100) unlocked.push('hundred_correct');
            if (streak >= 7) unlocked.push('week_marathon');
            if (level >= 20) unlocked.push('shogun');
            return unlocked;
        }

        async function loadAchievements() {
            const authNotice = document.getElementById('authNotice');
            let unlockedList;

            try {
                const res = await fetch('/api/achievements');
                const data = await res.json();
                if (data.status !== 'success') throw new Error('not logged in');

                unlockedList = data.achievements
                    .filter(a => a.unlocked)
                    .map(a => a.id);
                authNotice.classList.add('hidden');
            } catch (err) {
                // Не залогинен (или бэкенд недоступен) — считаем локально
                unlockedList = computeLocalUnlocked();
                authNotice.classList.remove('hidden');
            }

            const container = document.getElementById('achievementsList');
            container.innerHTML = '';

            achievementsData.forEach(ach => {
                const isUnlocked = unlockedList.includes(ach.id);
                
                const title = getTranslation(ach.titleKey, ach.id);
                const desc = getTranslation(ach.descKey, '');
                const statusText = isUnlocked 
                    ? getTranslation('unlocked_status', 'Разблокировано') 
                    : getTranslation('locked_status', 'Заблокировано');

                const card = document.createElement('div');
                card.className = `ach-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                card.innerHTML = `
                    <div class="ach-icon">${ach.icon}</div>
                    <div class="ach-info">
                        <h3>${title}</h3>
                        <p>${desc}</p>
                        <span class="ach-status">${statusText}</span>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        window.onload = function() {
            loadAchievements();
            if (typeof applyTranslations === 'function') {
                applyTranslations();
            }
        };
    </script>
</body>

</html>
