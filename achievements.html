<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения — 実績</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
        }

        .achievement-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: all 0.3s ease;
        }

        .achievement-card.locked {
            opacity: 0.4;
            filter: grayscale(100%);
            background: #f0f0f0;
        }

        .achievement-card.unlocked {
            border-color: #2ed573;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.2);
        }

        .achievement-icon {
            font-size: 2.5rem;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 50%;
        }

        .achievement-info h3 {
            margin: 0 0 5px 0;
            color: #e63946;
            font-size: 1.1rem;
        }

        .achievement-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }

        body.theme-dark .achievement-card {
            background-color: #1e1e2d !important;
            border-color: #2a2a3d !important;
            color: #fff !important;
        }

        body.theme-dark .achievement-icon {
            background-color: #2a2a3d !important;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 5px;
            display: inline-block;
        }
        .status-badge.unlocked { background: #e8fae8; color: #2ed573; }
        .status-badge.locked { background: #e0e0e0; color: #777; }
    </style>
</head>

<body>

    <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">🌐 RU</button>
    <button class="back-button" onclick="location.href='index.html'" data-i18n="back_menu">← Главное меню</button>

    <h1 data-i18n="achievements_title">実績 (Достижения)</h1>
    <p data-i18n="achievements_subtitle">Твой личный прогресс и награды 🏆</p>

    <div class="achievements-grid" id="achievementsGrid">
        <p style="text-align:center; width:100%;">Загрузка достижений...</p>
    </div>

<script>
        const iconMap = {
            'first_step': '🌱',
            'hundred_correct': '🎯',
            'week_marathon': '🔥',
            'shogun': '👑'
        };

        const defaultAchievements = [
            { id: 'first_step', title: 'Первый шаг', desc: 'Дать первый правильный ответ в упражнениях.', unlocked: false },
            { id: 'hundred_correct', title: 'Первая сотня', desc: 'Набрать 100 правильных ответов.', unlocked: false },
            { id: 'week_marathon', title: 'Недельный марафон', desc: 'Заходить в приложение 7 дней подряд.', unlocked: false },
            { id: 'shogun', title: 'Сёгун', desc: 'Достичь 20 уровня в профиле.', unlocked: false }
        ];

        function renderAchievements(achievements, isLoggedIn) {
            const grid = document.getElementById('achievementsGrid');
            grid.innerHTML = '';

            if (!isLoggedIn) {
                const notice = document.createElement('div');
                notice.style.gridColumn = '1 / -1';
                notice.style.textAlign = 'center';
                notice.style.marginBottom = '15px';
                notice.style.color = '#e63946';
                notice.innerHTML = '⚠️ <b>Вы не вошли в аккаунт.</b> <a href="index.html" style="color:#1d3557; text-decoration:underline;">Войдите</a>, чтобы сохранять свой прогресс и открывать достижения.';
                grid.appendChild(notice);
            }

            achievements.forEach(ach => {
                const card = document.createElement('div');
                card.className = `achievement-card ${ach.unlocked ? 'unlocked' : 'locked'}`;
                
                const icon = iconMap[ach.id] || '🏆';
                const statusText = ach.unlocked ? '✅ Открыто' : '🔒 Заблокировано';
                const statusClass = ach.unlocked ? 'unlocked' : 'locked';

                card.innerHTML = `
                    <div class="achievement-icon">${icon}</div>
                    <div class="achievement-info">
                        <h3>${ach.title}</h3>
                        <p>${ach.desc}</p>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadAchievements() {
            const grid = document.getElementById('achievementsGrid');
            try {
                const res = await fetch('/api/achievements');
                
                if (res.status === 401) {
                    renderAchievements(defaultAchievements, false);
                    return;
                }

                const data = await res.json();

                if (data.status === 'success') {
                    renderAchievements(data.achievements, true);
                } else {
                    renderAchievements(defaultAchievements, false);
                }
            } catch (err) {
                console.error("Ошибка при запросе ачивок:", err);
                grid.innerHTML = `<p style="color:red; text-align:center; grid-column: 1 / -1;">
                    Ошибка подключения к серверу.<br>Убедитесь, что сервер Flask запущен (<code>python app.py</code>).
                </p>`;
            }
        }

        window.onload = loadAchievements;
    </script>
    <script src="translations.js"></script>
</body>

</html>
